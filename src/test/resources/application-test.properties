# Test profile: isolated file-based SQLite database (written to target/, ignored by git)
# Overrides application.properties for all tests annotated with @ActiveProfiles("test")
# Uses create-drop so schema is always fresh; DataSeeder seeds predictable test data.

spring.datasource.url=jdbc:sqlite:target/test-advisor.db
spring.jpa.hibernate.ddl-auto=create-drop
advisor.cart.max-credits=40
