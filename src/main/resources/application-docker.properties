# ── Docker Profile Configuration ──────────────────────────────
# Active when running in container via docker-compose (SPRING_PROFILES_ACTIVE=docker)
# Overrides SQLite datasource settings from application.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/advisor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:advisor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:advisor}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ensure logging clearly indicates the profile and DB in container
logging.level.org.hibernate.SQL=DEBUG
logging.level.kz.edu.sdu.advisor=INFO

advisor.cart.max-credits=40

