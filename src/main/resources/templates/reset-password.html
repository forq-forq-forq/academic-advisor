<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password — Academic Advisor</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/tailwind-utilities.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/tailwind-config.js}" defer></script>
    <script th:src="@{/js/common.js}" defer></script>
</head>
<body class="font-sans antialiased">
<div class="login-card rounded-xl shadow-md">
    <h1>Set New Password</h1>
    <p class="subtitle">Use 12–64 characters with uppercase, lowercase, number, and symbol</p>

    <div class="error-msg" id="reset-error-msg" th:if="${error}" th:text="${error}"></div>

    <form th:if="${!tokenInvalid}" th:action="@{/reset-password}" method="post" novalidate>
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword"
                   autocomplete="new-password" required minlength="12" maxlength="64">
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required minlength="12" maxlength="64">
        </div>
        <button type="submit">Update Password</button>
    </form>

    <a class="register-link" th:if="${tokenInvalid}" th:href="@{/forgot-password}">Request a new reset link</a>
    <a class="register-link" th:href="@{/login}">Back to login</a>
</div>
</body>
</html>
