<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Academic Advisor</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/tailwind-utilities.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/tailwind-config.js}" defer></script>
    <script th:src="@{/js/common.js}" defer></script>
    <script th:src="@{/js/login.js}" defer></script>
</head>
<body class="font-sans antialiased">
<div class="login-card rounded-xl shadow-md">
    <h1>Academic Advisor</h1>
    <p class="subtitle">Enter your Student ID and password to continue</p>
    <p class="success-msg" th:if="${param.registered}">Your account has been created successfully.</p>
    <form th:action="@{/login}" method="post" id="loginForm" novalidate>
        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId"
                   th:value="${studentId}"
                   placeholder="e.g. 240103000" required autocomplete="username">
            <span class="field-hint" id="studentIdHint">Student ID is required</span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password">
            <span class="field-hint" id="passwordHint">Password is required</span>
        </div>
        <button type="submit">Log In</button>
    </form>
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <a class="register-link" th:href="@{/register}">Create an account</a>
</div>
</body>
</html>
