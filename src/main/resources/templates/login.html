<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Academic Advisor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }

        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 0.25rem;
        }

        .login-card p.subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.4rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.65rem 0.875rem;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            color: #2d3748;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #4c6ef5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #3b5bdb;
        }

        .error-msg {
            margin-top: 1rem;
            padding: 0.65rem 0.875rem;
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-radius: 8px;
            color: #c53030;
            font-size: 0.875rem;
        }

        .success-msg { color: #276749; margin-bottom: 1rem; font-size: 0.9rem; }
        .register-link { display: block; margin-top: 1rem; text-align: center; color: #3b5bdb; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Academic Advisor</h1>
    <p class="subtitle">Enter your Student ID to continue</p>
    <p class="success-msg" th:if="${param.registered}">Your account has been created successfully.</p>
    <form th:action="@{/login}" method="post">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" name="studentId"
               placeholder="e.g. 240103000" required autocomplete="off">
        <button type="submit">Log In</button>
    </form>
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <a class="register-link" th:href="@{/register}">Create an account</a>
</div>
</body>
</html>
