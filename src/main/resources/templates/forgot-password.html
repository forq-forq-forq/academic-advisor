<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Academic Advisor</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/tailwind-utilities.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/tailwind-config.js}" defer></script>
    <script th:src="@{/js/common.js}" defer></script>
</head>
<body class="font-sans antialiased">
<div class="login-card rounded-xl shadow-md">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your Student ID or @sdu.edu.kz email to receive a reset link</p>

    <div class="success-msg" id="forgot-success-msg" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="dev-reset-box" id="dev-reset-link-box" th:if="${demoResetUrl != null}">
        Simulated email link: <a th:href="@{${demoResetUrl}}">Open password reset link</a>
    </div>

    <form th:action="@{/forgot-password}" method="post" novalidate>
        <div class="form-group">
            <label for="identifier">Student ID or University Email</label>
            <input type="text" id="identifier" name="identifier"
                   th:value="${identifier}"
                   placeholder="e.g. 240103000 or 240103000@sdu.edu.kz" required>
        </div>
        <button type="submit">Send Reset Link</button>
    </form>

    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <a class="register-link" th:href="@{/login}">Back to login</a>
</div>
</body>
</html>
