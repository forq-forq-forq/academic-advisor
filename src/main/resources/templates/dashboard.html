<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Academic Advisor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top bar ── */
        header {
            background: #4c6ef5;
            color: #fff;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        header h1 { font-size: 1.1rem; font-weight: 700; }

        header .student-info {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        header a.logout {
            color: #fff;
            text-decoration: none;
            font-size: 0.825rem;
            padding: 0.3rem 0.75rem;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 6px;
            transition: background 0.2s;
        }

        header a.logout:hover { background: rgba(255,255,255,0.15); }

        /* ── Main layout ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 780px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem 1rem;
        }

        /* ── Chat window ── */
        #chat-window {
            flex: 1;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 1.25rem;
            overflow-y: auto;
            min-height: 420px;
            max-height: 55vh;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* Welcome placeholder */
        #chat-window .welcome-hint {
            margin: auto;
            text-align: center;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        /* ── Message bubbles ── */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .msg-row.user  { justify-content: flex-end; }
        .msg-row.ai    { justify-content: flex-start; }

        .bubble {
            max-width: 72%;
            padding: 0.6rem 0.9rem;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* User bubble — blue, right side */
        .msg-row.user .bubble {
            background: #4c6ef5;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        /* AI bubble — light grey, left side */
        .msg-row.ai .bubble {
            background: #edf2f7;
            color: #2d3748;
            border-bottom-left-radius: 4px;
        }

        /* Avatar circle */
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar.user-av { background: #4c6ef5; color: #fff; }
        .avatar.ai-av   { background: #e2e8f0; color: #4a5568; }

        /* Typing indicator bubble */
        .typing-bubble {
            background: #edf2f7;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 0.55rem 0.9rem;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-bubble span {
            width: 7px; height: 7px;
            background: #a0aec0;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.30s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40%            { transform: translateY(-5px); }
        }

        /* ── Input area ── */
        #input-area {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.85rem;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            padding: 0.65rem 0.9rem;
            border: 1.5px solid #cbd5e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #2d3748;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            overflow-y: auto;
        }

        #message-input:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }

        #message-input.invalid {
            border-color: #fc8181;
            box-shadow: 0 0 0 3px rgba(252, 129, 129, 0.2);
        }

        #send-btn {
            padding: 0.65rem 1.25rem;
            background: #4c6ef5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
            white-space: nowrap;
        }

        #send-btn:hover:not(:disabled) { background: #3b5bdb; }
        #send-btn:disabled { background: #a0aec0; cursor: not-allowed; }

        /* Validation warning */
        #validation-msg {
            font-size: 0.8rem;
            color: #c53030;
            margin-top: 0.3rem;
            min-height: 1rem;
        }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center; gap: 1.25rem;">
        <h1>🎓 Academic Advisor</h1>
        <nav style="display: flex; gap: 0.5rem;">
            <a th:href="@{/dashboard}" style="color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600; padding: 0.35rem 0.65rem; background: rgba(255,255,255,0.2); border-radius: 6px;">Dashboard</a>
            <a th:href="@{/planner}" style="color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.35rem 0.65rem; border-radius: 6px;">Planner</a>
        </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
        <span class="student-info">
            <span th:text="${student.name}">Student</span>
            &nbsp;·&nbsp;
            <span th:text="${student.studentId}">ID</span>
        </span>
        <a class="logout" th:href="@{/logout}">Log out</a>
    </div>
</header>

<main>
    <div id="chat-window">
        <div class="welcome-hint" id="welcome-hint">
            👋 Hello, <span th:text="${student.name}">Student</span>!
            Ask me anything about your courses, schedule, or academic plan.
        </div>
    </div>

    <div id="validation-msg"></div>

    <div id="input-area">
        <textarea id="message-input"
                  rows="1"
                  placeholder="Type your question…"
                  aria-label="Chat message input"></textarea>
        <button id="send-btn" type="button">Send</button>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const chatWindow    = document.getElementById('chat-window');
    const input         = document.getElementById('message-input');
    const sendBtn       = document.getElementById('send-btn');
    const validationMsg = document.getElementById('validation-msg');
    const welcomeHint   = document.getElementById('welcome-hint');

    // ── Auto-grow textarea ──────────────────────────────────────────
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // ── Send on Enter (Shift+Enter = newline) ───────────────────────
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ── Clear validation warning when user starts typing ───────────
    input.addEventListener('input', () => {
        if (input.value.trim()) {
            input.classList.remove('invalid');
            validationMsg.textContent = '';
        }
    });

    // ── Core send logic ─────────────────────────────────────────────
    function sendMessage() {
        const text = input.value.trim();

        // Scenario 3: empty input validation
        if (!text) {
            input.classList.add('invalid');
            validationMsg.textContent = '⚠ Please enter a message before sending.';
            input.focus();
            return;
        }

        // Clear validation state
        input.classList.remove('invalid');
        validationMsg.textContent = '';

        // Remove welcome hint on first real message
        if (welcomeHint) welcomeHint.remove();

        // Scenario 2: append user bubble, clear input immediately
        appendBubble('user', text);
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;

        // Show typing indicator
        const typingRow = appendTypingIndicator();

        // POST to backend
        const formData = new FormData();
        formData.append('message', text);

        fetch('/dashboard/chat', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                typingRow.remove();
                if (data.reply) {
                    appendBubble('ai', data.reply);
                } else {
                    appendBubble('ai', '⚠ ' + (data.error || 'Unexpected error. Please try again.'));
                }
            })
            .catch(() => {
                typingRow.remove();
                appendBubble('ai', '⚠ Could not reach the advisor. Check your connection and try again.');
            })
            .finally(() => {
                sendBtn.disabled = false;
                input.focus();
            });
    }

    // ── Helpers ──────────────────────────────────────────────────────
    function appendBubble(role, text) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;

        const av = document.createElement('div');
        av.className = 'avatar ' + (role === 'user' ? 'user-av' : 'ai-av');
        av.textContent = role === 'user' ? 'Me' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        if (role === 'user') {
            row.appendChild(bubble);
            row.appendChild(av);
        } else {
            row.appendChild(av);
            row.appendChild(bubble);
        }

        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return row;
    }

    function appendTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'msg-row ai';

        const av = document.createElement('div');
        av.className = 'avatar ai-av';
        av.textContent = 'AI';

        const typing = document.createElement('div');
        typing.className = 'typing-bubble';
        typing.innerHTML = '<span></span><span></span><span></span>';

        row.appendChild(av);
        row.appendChild(typing);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return row;
    }
    /*]]>*/
</script>

</body>
</html>
