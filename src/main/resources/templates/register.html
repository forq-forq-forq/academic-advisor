<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Academic Advisor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .register-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
            padding: 2rem;
            width: 100%;
            max-width: 460px;
        }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 0.35rem; }
        .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin: 0.85rem 0 0.35rem; }
        input, select {
            width: 100%;
            padding: 0.65rem 0.875rem;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            color: #2d3748;
        }
        input:focus, select:focus { outline: 2px solid #4c6ef5; outline-offset: 1px; }
        button {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #4c6ef5;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #3b5bdb; }
        .field-error { color: #c53030; font-size: 0.82rem; margin-top: 0.3rem; }
        .login-link { display: block; margin-top: 1rem; text-align: center; color: #3b5bdb; }
    </style>
</head>
<body>
<main class="register-card">
    <h1>Create your account</h1>
    <p class="subtitle">Register with your SDU university email and academic profile</p>
    <form th:action="@{/register}" method="post" th:object="${registrationForm}">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Aruzhan Serikova" autocomplete="name">
        <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

        <label for="email">University email</label>
        <input type="email" id="email" th:field="*{email}" placeholder="e.g. 240103001@sdu.edu.kz" autocomplete="email" required>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" th:field="*{studentId}" placeholder="Auto-filled from email (e.g. 240103001)" autocomplete="username">
        <p class="field-error" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></p>

        <label for="facultyCode">Faculty</label>
        <select id="facultyCode" th:field="*{facultyCode}" required>
            <option value="">Select faculty</option>
            <option th:each="faculty : ${faculties}" th:value="${faculty.code}" th:text="${faculty.name}"></option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('facultyCode')}" th:errors="*{facultyCode}"></p>

        <label for="majorCode">Major</label>
        <select id="majorCode" th:field="*{majorCode}" required>
            <option value="">Select major</option>
            <option th:each="major : ${majors}" th:value="${major.code}" th:text="${major.name}"
                    th:attr="data-faculty-code=${major.faculty != null ? major.faculty.code : ''}"></option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('majorCode')}" th:errors="*{majorCode}"></p>

        <label for="catalogYear">Catalog year</label>
        <select id="catalogYear" th:field="*{catalogYear}" required>
            <option value="">Select catalog year</option>
            <option th:each="year : ${catalogYears}" th:value="${year}" th:text="${year}"></option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('catalogYear')}" th:errors="*{catalogYear}"></p>

        <label for="careerGoal">Career goal (optional)</label>
        <input type="text" id="careerGoal" th:field="*{careerGoal}" placeholder="e.g. Backend Developer, Data Scientist">
        <p class="field-error" th:if="${#fields.hasErrors('careerGoal')}" th:errors="*{careerGoal}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="12" maxlength="64">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <button type="submit">Register</button>
    </form>
    <a class="login-link" th:href="@{/login}">Back to login</a>
</main>
<script>
    const facultySelect = document.getElementById('facultyCode');
    const majorSelect = document.getElementById('majorCode');
    const emailInput = document.getElementById('email');
    const studentIdInput = document.getElementById('studentId');

    function filterMajors() {
        const selectedFaculty = facultySelect.value;
        let visibleCount = 0;
        let lastVisibleValue = '';

        for (const option of majorSelect.options) {
            if (!option.value) {
                option.hidden = false;
                continue;
            }
            const belongs = !selectedFaculty || (option.getAttribute('data-faculty-code') === selectedFaculty);
            option.hidden = !belongs;
            if (belongs) {
                visibleCount++;
                lastVisibleValue = option.value;
            }
        }

        if (majorSelect.selectedOptions[0]?.hidden) {
            majorSelect.value = '';
        }
        if (visibleCount === 1 && !majorSelect.value) {
            majorSelect.value = lastVisibleValue;
        }
    }

    if (facultySelect.options.length === 2 && !facultySelect.value) {
        facultySelect.selectedIndex = 1;
    }

    emailInput.addEventListener('blur', () => {
        if (!studentIdInput.value.trim() && emailInput.value.includes('@')) {
            studentIdInput.value = emailInput.value.split('@')[0].trim();
        }
    });

    facultySelect.addEventListener('change', filterMajors);
    filterMajors();
</script>
</body>
</html>
