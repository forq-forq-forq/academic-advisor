<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Academic Advisor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .register-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
            padding: 2rem;
            width: 100%;
            max-width: 420px;
        }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 0.35rem; }
        .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin: 0.9rem 0 0.35rem; }
        input {
            width: 100%;
            padding: 0.65rem 0.875rem;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid #4c6ef5; outline-offset: 1px; }
        button {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: #4c6ef5;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #3b5bdb; }
        .field-error { color: #c53030; font-size: 0.82rem; margin-top: 0.3rem; }
        .login-link { display: block; margin-top: 1rem; text-align: center; color: #3b5bdb; }
    </style>
</head>
<body>
<main class="register-card">
    <h1>Create your account</h1>
    <p class="subtitle">Register with your SDU university email</p>
    <form th:action="@{/register}" method="post" th:object="${registrationForm}">
        <label for="email">University email</label>
        <input type="email" id="email" th:field="*{email}" autocomplete="email" required>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="12" maxlength="64">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <button type="submit">Register</button>
    </form>
    <a class="login-link" th:href="@{/login}">Back to login</a>
</main>
</body>
</html>
