spring.application.name=advisor
server.port=8080

# Loads a local .env file (git-ignored) as extra properties, if present.
# Used for local secrets like GEMINI_API_KEY - never committed to the repo.
spring.config.import=optional:file:.env[.properties]

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:advisor.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gemini AI API configuration
# GEMINI_API_KEY must be provided as an environment variable (see README) - never hardcode a real key here.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
gemini.api.connect-timeout=5s
gemini.api.read-timeout=20s
