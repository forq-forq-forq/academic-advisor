name: "\U0001F4CB User Story"
description: Define a new feature or capability for sprint planning.
title: "US: "
labels: ["user-story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Use the standard format.
      placeholder: |
        As a [type of user],
        I want [an action or feature],
        so that [benefit or value].
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the conditions that must be met for this story to be considered complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  
  - type: textarea
    id: qa-test
    attributes:
      label: QA Test
      description: Describe how the acceptance criteria should be verified with Given/When/Then scenarios.      
      placeholder: |
        - Scenario 1: Given [context], when [action], then [outcome].
        - Scenario 2: Given [context], when [action], then [outcome].
    validations:
      required: true

  - type: dropdown
    id: story-points
    attributes:
      label: Story Points
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
        - "21"
    validations:
      required: false

  - type: input
    id: ui-reference
    attributes:
      label: UI Reference
      description: Link to wireframe or mockup (Figma, Miro, etc.), if applicable.
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any technical context: responsibilities, constraints, dependencies, maintenance, etc.
    validations:
      required: false
